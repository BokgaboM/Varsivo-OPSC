# Continuous integration: every push / pull request runs the unit tests and builds the debug APK,
# so we know the app compiles and passes its tests on a clean machine (not just on our laptops).
#
# Based on the build guides given in the brief:
#  - https://github.com/marketplace/actions/automated-build-android-app-with-github-action
#  - https://github.com/IMAD5112/Github-actions/blob/main/.github/workflows/build.yml
name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: varsivo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
